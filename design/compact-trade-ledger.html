 if(v==null)return {label:'Unknown',tone:'st-none'};
 const [lo,hi]=Array.isArray(v)?v:[v,v],a=band(lo),b=band(hi);
 const index=a===b?a:b<=1?1:a>=3?3:-1;
 return {label:index<0?'Uncertain':labels[index],tone:index<0?'st-none':index<2?'st-lower':index>2?'st-higher':''};
}
const rate=v=>priceState(v).label;
const shade=v=>priceState(v).tone;
const defaults={compact:{tab:'markets',hold:'rift',x:.58,y:.13,locked:false,closed:false,pins:[],width:404,text:14},strip:{tab:'routes',hold:'rift',x:.39,y:.48,locked:false,closed:false,pins:[],width:600,text:14}};
const copy=o=>JSON.parse(JSON.stringify(o));
const saved=window.openai?.widgetState?.privateContent;
function sanitize(v,k){const s={...copy(defaults[k]),...(v||{})};if(!['markets','routes','rumors'].includes(s.tab))s.tab=defaults[k].tab;if(!holds[s.hold])s.hold='rift';for(const [key,min,max] of [['x',0,1],['y',0,1],['width',320,700],['text',13,16]]){if(!Number.isFinite(s[key]))s[key]=defaults[k][key];s[key]=Math.min(max,Math.max(min,s[key]));}s.pins=Array.isArray(s.pins)?[...new Set(s.pins.filter(n=>Number.isInteger(n)&&n>=0&&n<routes.length))]:[];s.locked=!!s.locked;s.closed=!!s.closed;return s;}
const state={compact:sanitize(saved?.compact,'compact'),strip:sanitize(saved?.strip,'strip')};
function save(k){if(!window.openai?.setWidgetState)return;window.openai.setWidgetState({modelContent:{design:k==='compact'?'Compact Ledger':'Trade Strip',view:state[k].tab,hold:holds[state[k].hold].name,position:{x:state[k].x,y:state[k].y},locked:state[k].locked},privateContent:copy(state)}).catch(()=>{});}
function market(s){const m=holds[s.hold];return `<div class="st-marketbar"><select class="cursor-interaction" data-action="hold" aria-label="Hold">${Object.entries(holds).map(([k,h])=>`<option value="${k}" ${k===s.hold?'selected':''}>${h.name}</option>`).join('')}</select><span class="st-age ${m.kind==='stale'?'st-old':''}" data-tooltip="${m.source}">${m.age}</span></div><table class="st-grid" aria-label="Remembered market prices"><thead><tr><th>Goods</th><th class="st-num">Prices</th></tr></thead><tbody>${goods.map((g,i)=>`<tr><td><span class="st-good">${icon(g[1])}${g[0]}</span></td><td class="st-num ${shade(m.rates[i])}" data-tooltip="${m.rates[i]==null?'No report':m.source}">${rate(m.rates[i])}</td></tr>`).join('')}</tbody></table>`;}
function routeCell(key,v){const m=holds[key];return `<td><div class="st-rateline"><span>${m.short}</span><span class="${shade(v)}">${rate(v)}</span></div><div class="st-routeage ${m.kind==='stale'?'st-old':''}" data-tooltip="${m.source}">${m.age}</div></td>`;}
function routeView(s){return `<table class="st-grid st-routes" aria-label="Routes from remembered market reports"><thead><tr><th>Goods</th><th>From</th><th>To</th><th aria-label="Bookmark"></th></tr></thead><tbody>${routes.map((r,i)=>`<tr><td><div class="st-routegood">${goods[r.good][0]}</div></td>${routeCell(r.from,holds[r.from].rates[r.good])}${routeCell(r.to,holds[r.to].rates[r.good])}<td><button class="st-pin cursor-interaction" data-action="pin" data-value="${i}" aria-pressed="${s.pins.includes(i)}" aria-label="${s.pins.includes(i)?'Forget':'Remember'} ${goods[r.good][0].toLowerCase()} route" data-tooltip="${s.pins.includes(i)?'Forget':'Remember'} route">${icon(s.pins.includes(i)?'bookmark-check':'bookmark')}</button></td></tr>`).join('')}</tbody></table>`;}
function rumorView(){return `<ul class="st-news" aria-label="Latest rumors">${news.map(n=>`<li><div class="st-newshead"><button class="cursor-interaction" data-action="report" data-value="${n.hold}">${holds[n.hold].name} · ${goods[n.good][0]}</button><span class="${shade(n.rate)}">${rate(n.rate)}</span></div><div class="st-newssource">${n.source}</div></li>`).join('')}</ul>`;}
function scene(k){return root.querySelector(`[data-design="${k}"]`);}
function position(k){const s=state[k],stage=scene(k),win=stage.querySelector('.st-window');if(!stage.clientWidth||s.closed)return;const minimum=stage.clientWidth<=560?620:560;const required=Math.max(minimum,win.offsetHeight+32);if(stage.style.minHeight!==required+'px')stage.style.minHeight=required+'px';const w=stage.clientWidth,h=stage.clientHeight;const left=Math.max(16,Math.min(s.x*w,w-win.offsetWidth-16)),top=Math.max(16,Math.min(s.y*h,h-win.offsetHeight-16));win.style.left=left+'px';win.style.top=top+'px';}
function draw(k){const stage=scene(k),s=state[k],win=stage.querySelector('.st-window');win.hidden=s.closed;win.style.display=s.closed?'none':'';stage.querySelector('.st-reopen').hidden=!s.closed;win.style.setProperty('--width',s.width+'px');win.style.setProperty('--type',s.text+'px');win.innerHTML=`<header class="st-top"><button class="st-grab" type="button" data-action="move" aria-label="Move trade ledger. Drag or use arrow keys." aria-disabled="${s.locked}">${icon('grip-vertical')}<span>Trade ledger</span></button><button class="st-iconbutton cursor-interaction" type="button" data-action="lock" aria-pressed="${s.locked}" aria-label="${s.locked?'Unlock':'Lock'} window position" data-tooltip="${s.locked?'Unlock':'Lock'} position">${icon(s.locked?'lock-keyhole':'lock-keyhole-open')}</button><button class="st-iconbutton cursor-interaction" type="button" data-action="close" aria-label="Close trade ledger">${icon('x')}</button></header><nav class="st-nav" aria-label="Trade views">${[['markets','Markets'],['routes','Routes'],['rumors','Rumors']].map(([v,t])=>`<button class="cursor-interaction" type="button" data-action="tab" data-value="${v}" aria-pressed="${s.tab===v}">${t}</button>`).join('')}</nav><div class="st-content" aria-live="polite">${s.tab==='markets'?market(s):s.tab==='routes'?routeView(s):rumorView()}</div>`;if(globalThis.lucide)lucide.createIcons({attrs:{width:14,height:14}});position(k);}
for(const k of Object.keys(state))draw(k);
root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const k=b.closest('[data-design]').dataset.design,s=state[k],a=b.dataset.action,v=b.dataset.value;if(a==='move')return;if(a==='tab')s.tab=v;if(a==='pin'){const n=Number(v);s.pins=s.pins.includes(n)?s.pins.filter(x=>x!==n):[...s.pins,n];}if(a==='report'){s.hold=v;s.tab='markets';}if(a==='lock')s.locked=!s.locked;if(a==='close')s.closed=true;if(a==='reopen')s.closed=false;draw(k);const replacement=scene(k).querySelector(`button[data-action="${a}"]${v===undefined?'':`[data-value="${v}"]`}`);if(replacement&&replacement.offsetWidth)replacement.focus({preventScroll:true});save(k);});
root.addEventListener('change',e=>{if(!e.target.matches('select[data-action=hold]'))return;const k=e.target.closest('[data-design]').dataset.design;state[k].hold=e.target.value;draw(k);scene(k).querySelector('select').focus({preventScroll:true});save(k);});
let drag=null;
root.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-action=move]');if(!handle||e.button!==0)return;const k=handle.closest('[data-design]').dataset.design;if(state[k].locked)return;const stage=scene(k),win=stage.querySelector('.st-window');drag={k,id:e.pointerId,sx:e.clientX,sy:e.clientY,left:parseFloat(win.style.left)||16,top:parseFloat(win.style.top)||16,handle};handle.setPointerCapture(e.pointerId);});
root.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(!(e.buttons&1)){endDrag(e);return;}const stage=scene(drag.k),win=stage.querySelector('.st-window');const left=Math.max(16,Math.min(drag.left+e.clientX-drag.sx,stage.clientWidth-win.offsetWidth-16)),top=Math.max(16,Math.min(drag.top+e.clientY-drag.sy,stage.clientHeight-win.offsetHeight-16));state[drag.k].x=left/stage.clientWidth;state[drag.k].y=top/stage.clientHeight;position(drag.k);});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const old=drag;drag=null;if(old.handle.hasPointerCapture(old.id))old.handle.releasePointerCapture(old.id);save(old.k);}
root.addEventListener('pointerup',endDrag);root.addEventListener('pointercancel',endDrag);root.addEventListener('lostpointercapture',endDrag);
root.addEventListener('keydown',e=>{const handle=e.target.closest('[data-action=move]');if(!handle||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;const k=handle.closest('[data-design]').dataset.design,s=state[k];if(s.locked)return;e.preventDefault();const stage=scene(k),win=stage.querySelector('.st-window'),step=e.shiftKey?24:8;let x=parseFloat(win.style.left),y=parseFloat(win.style.top);if(e.key==='ArrowLeft')x-=step;if(e.key==='ArrowRight')x+=step;if(e.key==='ArrowUp')y-=step;if(e.key==='ArrowDown')y+=step;s.x=x/stage.clientWidth;s.y=y/stage.clientHeight;position(k);s.x=parseFloat(win.style.left)/stage.clientWidth;s.y=parseFloat(win.style.top)/stage.clientHeight;save(k);});
const ro=new ResizeObserver(()=>Object.keys(state).forEach(position));for(const stage of root.querySelectorAll('.st-scene')){ro.observe(stage);ro.observe(stage.querySelector('.st-window'));}
window.addEventListener('openai:set_globals',e=>{const value=e.detail?.globals?.widgetState?.privateContent;if(!value)return;for(const k of Object.keys(state)){if(value[k]){const checked=sanitize(value[k],k);Object.assign(state[k],checked);draw(k);}}});
if(globalThis.Tweak){for(const k of Object.keys(state)){const el=scene(k).querySelector('.st-window');const t=new Tweak({container:el,onChange:()=>draw(k)});t.addSlider(state[k],'width',{label:'Window width',min:320,max:700,step:10,unit:'px'});t.addSlider(state[k],'text',{label:'Text size',min:13,max:16,unit:'px'});}}
})();
</script>
