<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
#stem-concepts .ste-screen{--ink:light-dark(#262923,#e4e4d9);--soft:light-dark(#575d51,#a5afa7);--surface:light-dark(#dfdfd3,#171e1d);--raised:light-dark(#eeeede,#202927);--line:light-dark(#afb1a0,#3d4942);--gold:light-dark(#765c27,#c4ad76);--wash:light-dark(#c9cdbd,#2a3830);--green:light-dark(#38634c,#9bc4a8);--amber:light-dark(#885d24,#dbb57b);--ui:15px;box-sizing:border-box;min-height:742px;display:flex;flex-direction:column;position:relative;background:var(--surface);color:var(--ink);font:400 var(--ui)/1.45 Inter,Arial,sans-serif;border:1px solid var(--line);overflow-wrap:anywhere}

#stem-concepts .ste-tag.old{color:var(--amber)}

#stem-concepts .ste-table th{font-size:calc(var(--ui) - 3px);font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:0 11px 11px;text-align:left;border-bottom:1px solid var(--line)}

#stem-concepts .ste-detail p{font-size:calc(var(--ui) - 2px);color:var(--soft)}
#stem-concepts .ste-trace{display:flex;align-items:center;gap:9px;color:var(--gold);font-size:calc(var(--ui) - 2px);margin-bottom:6px}

#stem-concepts .ste-pin svg{width:15px;height:15px}
#stem-concepts .ste-unknown{padding:46px 15px;text-align:center;color:var(--soft)}
#stem-concepts .ste-unknown svg{height:34px;width:34px;color:var(--gold);margin-bottom:16px}
#stem-concepts .ste-unknown h3{color:var(--ink);margin-bottom:10px}
#stem-concepts .ste-journal{--surface:light-dark(#e6d9b8,#332f25);--raised:light-dark(#efe2c0,#3e392e);--ink:light-dark(#322f24,#eadcba);--soft:light-dark(#6b6047,#b8a889);--line:light-dark(#c3b28d,#625742);--gold:light-dark(#80532b,#d3b276);--wash:light-dark(#dac8a2,#4b402f);--green:light-dark(#3f6450,#b2c4a1);--amber:light-dark(#8b512b,#e1b381);border:9px solid light-dark(#4f4230,#211f1b);box-shadow:inset 0 0 0 1px var(--gold);font-family:'Cormorant Garamond',Georgia,serif}
#stem-concepts .ste-journal .ste-header{padding:26px 27px 17px;border-bottom:1px solid var(--line)}
#stem-concepts .ste-journal .ste-brand{font-size:calc(var(--ui) + 1px)}
#stem-concepts .ste-journal .ste-title{font-style:italic}
#stem-concepts .ste-journal .ste-nav{gap:32px;justify-content:center;padding:0 20px;background:var(--raised)}
#stem-concepts .ste-journal .ste-nav button{font-size:calc(var(--ui) - 1px)}
#stem-concepts .ste-book{display:grid;grid-template-columns:1.06fr 1fr;width:100%;background:linear-gradient(90deg,transparent 50%,color-mix(in srgb,var(--line) 25%,transparent) 51%,transparent 54%)}
#stem-concepts .ste-page{padding:29px 29px 25px;min-width:0}
#stem-concepts .ste-page+ .ste-page{border-left:1px solid var(--line)}
#stem-concepts .ste-journal .ste-table{font-size:calc(var(--ui) + 1px)}
#stem-concepts .ste-journal .ste-table th{font-size:calc(var(--ui) - 2px)}
#stem-concepts .ste-journal .ste-table td{padding:12px 9px}
#stem-concepts .ste-journal .ste-caption,#stem-concepts .ste-journal .ste-eyebrow{font-size:calc(var(--ui) - 1px)}
#stem-concepts .ste-select{background:var(--raised);border:1px solid var(--line);border-radius:0;padding:7px 10px;margin:15px 0 20px;max-width:100%;width:100%}
#stem-concepts .ste-quotation{font:400 calc(var(--ui) + 8px)/1.35 'Cormorant Garamond',Georgia,serif;border-left:2px solid var(--gold);padding-left:19px;margin:22px 0 14px}
#stem-concepts .ste-signature{font:400 calc(var(--ui) + 2px)/1.5 'Cormorant Garamond',Georgia,serif;color:var(--soft);font-style:italic}
#stem-concepts .ste-entry{border-top:1px solid var(--line);margin-top:25px;padding-top:18px}
#stem-concepts .ste-entry .ste-heading{font-size:calc(var(--ui) + 7px)}
#stem-concepts .ste-journal .ste-pin{font-size:var(--ui)!important}
#stem-concepts .ste-planner{--surface:light-dark(#e0e1dc,#151b20);--raised:light-dark(#eeeee6,#202930);--ink:light-dark(#202a2c,#e2e6e5);--soft:light-dark(#59666b,#a0b1b7);--line:light-dark(#b6c2c4,#3b4b53);--gold:light-dark(#69603a,#d0bd88);--wash:light-dark(#c9d6d2,#2b3d40);--green:light-dark(#3d6954,#a3c6b7);--amber:light-dark(#91652d,#d2b47e)}
#stem-concepts .ste-routebody{display:grid;grid-template-columns:245px 1fr;width:100%;min-width:0}
#stem-concepts .ste-routelist{padding:25px 20px;border-right:1px solid var(--line)}
#stem-concepts .ste-routebtn{width:100%;padding:17px 14px!important;margin-bottom:10px;border:1px solid var(--line)!important;display:block}
#stem-concepts .ste-routebtn[aria-pressed=true]{background:var(--wash);border-color:var(--gold)!important}
#stem-concepts .ste-routebtn span{display:block;margin-top:7px;font-size:calc(var(--ui) - 3px);color:var(--soft)}
#stem-concepts .ste-routebig{font:500 calc(var(--ui) + 14px)/1.1 'Cormorant Garamond',Georgia,serif;margin:6px 0 10px}
#stem-concepts .ste-routeends{display:grid;grid-template-columns:1fr 36px 1fr;gap:10px;align-items:center;margin:29px 0 27px}
#stem-concepts .ste-routeend{padding:17px 17px 20px;border-top:1px solid var(--gold);background:var(--raised)}
#stem-concepts .ste-routeend h3{font:500 calc(var(--ui) + 8px)/1.2 'Cormorant Garamond',Georgia,serif}
#stem-concepts .ste-routeend strong{display:block;font:400 calc(var(--ui) + 18px)/1.1 'Cormorant Garamond',Georgia,serif;margin:18px 0 5px;font-variant-numeric:tabular-nums}
#stem-concepts .ste-routearrow{color:var(--gold);display:grid;place-items:center}
#stem-concepts .ste-routearrow svg{width:27px;height:27px}
#stem-concepts .ste-route-note{padding:16px 0;border-top:1px solid var(--line);font:400 calc(var(--ui) + 5px)/1.4 'Cormorant Garamond',Georgia,serif}
#stem-concepts .ste-rumorlist{width:100%;padding:27px 31px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
#stem-concepts .ste-rumorcard{padding:22px;border:1px solid var(--line);background:var(--raised)}
#stem-concepts .ste-rumorcard blockquote{font:400 calc(var(--ui) + 8px)/1.3 'Cormorant Garamond',Georgia,serif;margin:15px 0 18px}
#stem-concepts .ste-rumorcard button{color:var(--gold);margin-top:15px}
#stem-concepts .ste-onlymobile{display:none}
#stem-concepts .ste-screen{min-height:1020px}
#stem-concepts .ste-journal{font-family:Inter,Arial,sans-serif}
#stem-concepts .ste-journal .ste-table{font-size:calc(var(--ui) - 1px)}
#stem-concepts .ste-journal .ste-caption,#stem-concepts .ste-journal .ste-eyebrow{font-size:calc(var(--ui) - 3px)}
#stem-concepts .ste-journal .ste-nav button{font-size:calc(var(--ui) - 3px)}
@media(max-width:780px){#stem-concepts .ste-screen{min-height:1100px}#stem-concepts .ste-header{padding:22px 24px 18px}#stem-concepts .ste-date{display:none}#stem-concepts .ste-side{width:156px;padding-left:13px;padding-right:10px}#stem-concepts .ste-main{padding:24px 18px}#stem-concepts .ste-heading{font-size:calc(var(--ui) + 9px)}#stem-concepts .ste-table .ste-secondary{display:none}#stem-concepts .ste-routebody{grid-template-columns:195px 1fr}#stem-concepts .ste-routelist{padding:24px 12px}#stem-concepts .ste-page{padding:26px 19px}#stem-concepts .ste-routeends{gap:6px;grid-template-columns:1fr 24px 1fr}#stem-concepts .ste-routeend{padding:15px 12px}#stem-concepts .ste-routeend strong{font-size:calc(var(--ui) + 12px)}}
@media(max-width:560px){#stem-concepts .ste-screen{min-height:1640px;--ui:15px}#stem-concepts .ste-header{gap:13px;padding:24px 18px 19px}#stem-concepts .ste-title{font-size:calc(var(--ui) + 14px)}#stem-concepts .ste-brand{font-size:14px;line-height:1.4;letter-spacing:.035em}#stem-concepts .ste-seal{width:36px;height:45px}#stem-concepts .ste-nav{gap:24px;padding:0 19px;justify-content:space-between}#stem-concepts .ste-nav button{font-size:12px}#stem-concepts .ste-side{display:none}#stem-concepts .ste-onlymobile{display:block}#stem-concepts .ste-main{padding:25px 18px}#stem-concepts .ste-markethead{flex-wrap:wrap;gap:12px;margin-bottom:22px}#stem-concepts .ste-table td{padding:14px 7px}#stem-concepts .ste-detail{grid-template-columns:1fr;gap:20px}#stem-concepts .ste-book{grid-template-columns:1fr;background:none}#stem-concepts .ste-page{padding:24px 19px}#stem-concepts .ste-page+.ste-page{border-left:0;border-top:1px solid var(--line)}#stem-concepts .ste-journal .ste-header{padding:23px 18px}#stem-concepts .ste-journal .ste-nav{gap:23px}#stem-concepts .ste-journal .ste-nav button{font-size:13px}#stem-concepts .ste-routebody{display:block}#stem-concepts .ste-routelist{padding:22px 18px 4px;border-right:0;border-bottom:1px solid var(--line)}#stem-concepts .ste-routebtn{padding:10px 13px!important;margin-bottom:9px}#stem-concepts .ste-routebtn span{margin-top:3px}#stem-concepts .ste-routeends{grid-template-columns:1fr;gap:10px;margin:23px 0}#stem-concepts .ste-routearrow{transform:rotate(90deg)}#stem-concepts .ste-routeend{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}#stem-concepts .ste-routeend strong{margin:0;font-size:29px;text-align:right}#stem-concepts .ste-routeend .ste-caption{grid-column:1/-1}#stem-concepts .ste-rumorlist{grid-template-columns:1fr;padding:22px 18px}#stem-concepts .ste-footer{padding:16px 18px;gap:13px}#stem-concepts .ste-quotation{font-size:23px}}
</style>
<div id="stem-concepts" class="viz-carousel" aria-label="Skyrim True Economy and Merchantry menu designs">
<section data-variant="Hold Ledger" aria-label="Hold Ledger design"><div class="ste-screen" data-skin="ledger" aria-label="Hold Ledger appearance"></div></section>
<section data-variant="Merchant’s Journal" aria-label="Merchant’s Journal design" hidden><div class="ste-screen ste-journal" data-skin="journal" aria-label="Merchant’s Journal appearance"></div></section>
<section data-variant="Caravan Planner" aria-label="Caravan Planner design" hidden><div class="ste-screen ste-planner" data-skin="planner" aria-label="Caravan Planner appearance"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('stem-concepts');
const goods=[['drink','Ale & mead','wine'],['metal','Precious metals','gem'],['weapon','Weapons','swords'],['food','Food','wheat'],['housewares','Household goods','utensils'],['armor','Armour','shield'],['ingredients','Ingredients','leaf']];
const markets={whiterun:{name:'Whiterun',where:'The Bannered Mare',age:'Seen today',source:'Your visit',kind:'visited',rates:[112,104,72,98,93,81,124]},rift:{name:'The Rift',where:'Riften',age:'Seen 3 days ago',source:'Your visit',kind:'visited',rates:[68,123,108,77,88,111,91]},reach:{name:'The Reach',where:'Markarth',age:'Seen 2 days ago',source:'Your visit',kind:'visited',rates:[139,61,89,144,78,94,126]},pale:{name:'The Pale',where:'Dawnstar',age:'Report 2 days old',source:'Jonna · heard today',kind:'rumor',rates:[[180,200],null,null,[140,160],null,null,null]},haafingar:{name:'Haafingar',where:'Solitude',age:'Seen 8 days ago',source:'Your visit',kind:'old',rates:[124,171,136,105,117,132,153]},eastmarch:{name:'Eastmarch',where:'Windhelm',age:'Seen 4 days ago',source:'Your visit',kind:'visited',rates:[127,102,112,109,86,117,99]},hjaalmarch:{name:'Hjaalmarch',where:'Moorside Inn',age:'Seen today',source:'Your visit',kind:'visited',rates:[101,139,156,106,114,132,73]},falkreath:{name:'Falkreath',where:'Dead Man’s Drink',age:'Report 5 days old',source:'Orgnar · heard yesterday',kind:'rumor',rates:[[120,140],null,null,[60,80],null,null,null]},winterhold:{name:'Winterhold',where:'Winterhold',age:'No reports',source:'',kind:'unknown',rates:[null,null,null,null,null,null,null]},solstheim:{name:'Solstheim',where:'Raven Rock',age:'No reports',source:'',kind:'unknown',rates:[null,null,null,null,null,null,null]}};
const routes=[{name:'Mead for the north',from:'rift',to:'pale',good:0,towns:'Riften → Dawnstar',note:'Word from Dawnstar says the inns are paying well for mead.',source:'Jonna, Moorside Inn',heard:'Heard today · news 2 days old'},{name:'Silver to Solitude',from:'reach',to:'haafingar',good:1,towns:'Markarth → Solitude',note:'Your old notes suggest silver may fetch more in Solitude.',source:'Your visit to Solitude',heard:'Seen 8 days ago · stale report'},{name:'Arms for Eastmarch',from:'whiterun',to:'eastmarch',good:2,towns:'Whiterun → Windhelm',note:'Weapons were dearer in Windhelm when you last passed through.',source:'Your visit to Windhelm',heard:'Seen 4 days ago'}];
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const rate=v=>v==null?'—':Array.isArray(v)?`${v[0]}–${v[1]}%`:`${v}%`;
const signal=v=>v==null?['','No report']:(Array.isArray(v)?(v[0]+v[1])/2:v)<90?['low','Low']:(Array.isArray(v)?(v[0]+v[1])/2:v)>120?['high','High']:['','Usual'];
const title={ledger:'Trade & markets',journal:'A merchant’s journal',planner:'The road ahead'};
const def={ledger:{tab:'markets',hold:'rift',good:0,route:0,pins:[]},journal:{tab:'markets',hold:'pale',good:0,route:0,pins:[]},planner:{tab:'routes',hold:'rift',good:0,route:0,pins:[]}};
let remembered=window.openai?.widgetState?.privateContent||{};
const state={}; for(const k of Object.keys(def)){state[k]={...def[k],...(remembered[k]||{})};if(!markets[state[k].hold])state[k].hold=def[k].hold;if(!['markets','routes','rumors'].includes(state[k].tab))state[k].tab=def[k].tab;if(!goods[state[k].good])state[k].good=0;if(!routes[state[k].route])state[k].route=0;if(!Array.isArray(state[k].pins))state[k].pins=[];}
function persist(skin){window.openai?.setWidgetState?.({modelContent:{design:skin,view:state[skin].tab,hold:markets[state[skin].hold].name,pinnedLeads:state[skin].pins},privateContent:state}).catch(()=>{});}
function holdSelect(s){return `<select class="ste-select cursor-interaction" data-action="hold" aria-label="Choose hold">${Object.entries(markets).map(([k,m])=>`<option value="${k}" ${s.hold===k?'selected':''}>${m.name} · ${m.age}</option>`).join('')}</select>`;}
function table(s,compact=false){const m=markets[s.hold];return `<table class="ste-table" aria-label="Remembered commodity rates"><thead><tr><th>Goods</th><th class="ste-number">Last rate</th>${compact?'':'<th class="ste-secondary">Report</th>'}</tr></thead><tbody>${goods.map((g,i)=>{const [color,label]=signal(m.rates[i]);return `<tr class="${s.good===i?'chosen':''}"><td><button class="cursor-interaction" data-action="good" data-value="${i}" aria-pressed="${s.good===i}">${icon(g[2])}${g[1]}</button></td><td class="ste-number">${rate(m.rates[i])}<span class="ste-stamp ste-signal ${color}">${label}</span></td>${compact?'':`<td class="ste-secondary ste-muted">${m.rates[i]==null?'Unknown':m.kind==='rumor'?'Rumour':'Firsthand'}</td>`}</tr>`;}).join('')}</tbody></table>`;}
function pin(s,index){return `<button class="ste-pin cursor-interaction" data-action="pin" data-value="${index}" aria-pressed="${s.pins.includes(index)}">${icon(s.pins.includes(index)?'bookmark-check':'bookmark')}${s.pins.includes(index)?'Lead remembered':'Remember this lead'}</button>`;}
function ledger(s){const m=markets[s.hold];const route=routes.findIndex(r=>r.good===s.good);return `<aside class="ste-side"><div class="ste-eyebrow">The holds</div>${Object.entries(markets).map(([k,v])=>`<button class="ste-hold cursor-interaction" aria-pressed="${k===s.hold}" data-action="hold" data-value="${k}"><span>${v.name}</span><span class="ste-dot">${v.kind==='unknown'?'○':v.kind==='rumor'?'◇':'•'}</span></button>`).join('')}</aside><main class="ste-main"><div class="ste-onlymobile">${holdSelect(s)}</div><div class="ste-markethead"><div><div class="ste-eyebrow">Remembered market</div><h2 class="ste-heading">${m.name}</h2><div class="ste-caption">${m.where} · ${m.source||'No word from this hold'}</div></div><span class="ste-tag ${m.kind==='old'?'old':''}">${m.age}</span></div>${table(s)}<div class="ste-detail"><div><h3>${goods[s.good][1]}</h3><p>${m.rates[s.good]==null?'You have no report for these goods.':m.kind==='rumor'?'An approximate rate, passed on by a traveller.':'The rate you noted when you last visited.'}</p><div class="ste-caption">Regional rate · usual = 100%</div></div><div>${route>=0?`<div class="ste-trace">${icon('route')}${routes[route].towns}</div><p>${routes[route].heard}</p><button class="ste-pin cursor-interaction" data-action="route" data-value="${route}">Examine this lead ${icon('arrow-up-right')}</button>`:'<div class="ste-trace">No route noted</div><p>Compare another hold’s reports.</p>'}</div></div></main>`;}
function journal(s){const m=markets[s.hold];const lead=routes.findIndex(r=>r.good===s.good);const r=routes[lead<0?0:lead];return `<div class="ste-book"><main class="ste-page"><div class="ste-eyebrow">Market observations</div><h2 class="ste-heading">${m.name}</h2>${holdSelect(s)}${table(s,true)}<div class="ste-caption">${m.age} · regional rate, usual = 100%</div></main><aside class="ste-page"><div class="ste-eyebrow">Word along the road</div><h2 class="ste-heading">${r.name}</h2><blockquote class="ste-quotation">“${r.note}”</blockquote><div class="ste-signature">${r.source}<br>${r.heard}</div><div class="ste-entry"><div class="ste-eyebrow">${goods[s.good][1]} · ${m.name}</div><h3 class="ste-heading">${m.rates[s.good]==null?'No report':rate(m.rates[s.good])+' <span class="ste-muted">of the usual rate</span>'}</h3><div class="ste-caption">${m.rates[s.good]==null?'No observation recorded.':m.source+' · '+m.age}</div></div><div class="ste-entry"><div class="ste-trace">${icon('route')}${r.towns}</div><div class="ste-caption">${rate(markets[r.from].rates[r.good])} at origin · ${rate(markets[r.to].rates[r.good])} at destination</div>${pin(s,lead<0?0:lead)}</div></aside></div>`;}
function planner(s){const r=routes[s.route],a=markets[r.from],b=markets[r.to];return `<div class="ste-routebody"><aside class="ste-routelist"><div class="ste-eyebrow">Possible journeys</div>${routes.map((r,i)=>`<button class="ste-routebtn cursor-interaction" data-action="route" data-value="${i}" aria-pressed="${s.route===i}">${r.name}<span>${r.towns}</span><span>${s.pins.includes(i)?'Bookmarked · ':''}${r.heard.split(' · ')[0]}</span></button>`).join('')}<div class="ste-caption">Leads from your observations<br>and the people you’ve met.</div></aside><main class="ste-main"><div class="ste-eyebrow">${goods[r.good][1]} · trade lead</div><h2 class="ste-routebig">${r.towns}</h2><div class="ste-caption">Compare the last reported rates</div><div class="ste-routeends"><div class="ste-routeend"><h3>${a.name}</h3><strong>${rate(a.rates[r.good])}</strong><div class="ste-caption">${a.age}<br>${a.source}</div></div><div class="ste-routearrow">${icon('arrow-right')}</div><div class="ste-routeend"><h3>${b.name}</h3><strong>${rate(b.rates[r.good])}</strong><div class="ste-caption">${b.age}<br>${b.source}</div></div></div><div class="ste-route-note">${r.note}</div><div class="ste-detail"><div><div class="ste-trace">${icon('message-circle')}${r.source}</div><p>${r.heard}</p></div><div><div class="ste-trace">${icon(b.kind==='old'?'hourglass':'notebook-pen')}${b.kind==='old'?'Old information':'Regional rates'}</div><p>${b.kind==='old'?'Solitude’s market may have changed.':'Usual = 100%. These reports may have changed.'}</p></div></div>${pin(s,s.route)}</main></div>`;}
function rumors(s){return `<main class="ste-rumorlist">${routes.map((r,i)=>`<article class="ste-rumorcard"><div class="ste-eyebrow">${markets[r.to].name} · ${goods[r.good][1]}</div><h2 class="ste-heading">${r.name}</h2><blockquote>“${r.note}”</blockquote><div class="ste-caption">${r.source}<br>${r.heard}</div><button class="ste-pin cursor-interaction" data-action="route" data-value="${i}">Compare the reports ${icon('arrow-up-right')}</button></article>`).join('')}<article class="ste-rumorcard"><div class="ste-eyebrow">Winterhold</div><h2 class="ste-heading">No word yet</h2><div class="ste-quotation">An empty page, for now.</div><div class="ste-caption">No market reports from this hold.</div><button class="cursor-interaction" data-action="hold" data-value="winterhold">Open the ledger →</button></article></main>`;}
function draw(skin){const el=root.querySelector(`[data-skin="${skin}"]`),s=state[skin];el.innerHTML=`<header class="ste-header"><div class="ste-seal">${icon(skin==='journal'?'book-open':skin==='planner'?'compass':'scale')}</div><div><div class="ste-brand">Skyrim True Economy and Merchantry</div><h1 class="ste-title">${title[skin]}</h1></div><div class="ste-date">20th of Last Seed<strong>4E 201</strong></div></header><nav class="ste-nav" aria-label="Trade views">${[['markets','Markets'],['routes','Trade routes'],['rumors','Rumours']].map(([v,t])=>`<button class="cursor-interaction" data-action="tab" data-value="${v}" aria-pressed="${s.tab===v}">${t}</button>`).join('')}</nav><div class="ste-body" aria-live="polite">${s.tab==='rumors'?rumors(s):s.tab==='routes'?planner(s):skin==='journal'?journal(s):ledger(s)}</div><footer class="ste-footer"><span><kbd>↑ ↓</kbd> Browse <span style="margin-left:12px"><kbd>Enter</kbd> Select</span></span><span>${s.pins.length?s.pins.length+' lead'+(s.pins.length===1?'':'s')+' remembered':'Your own observations & travellers’ reports'}</span><span><kbd>Esc</kbd> Return to Skyrim</span></footer>`;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
for(const skin of Object.keys(state))draw(skin);
root.addEventListener('click',ev=>{const b=ev.target.closest('button[data-action]');if(!b)return;const skin=b.closest('[data-skin]').dataset.skin,s=state[skin],a=b.dataset.action,v=b.dataset.value;if(a==='tab')s.tab=v;if(a==='hold'){s.hold=v;s.tab='markets';}if(a==='good')s.good=Number(v);if(a==='route'){s.route=Number(v);s.tab='routes';}if(a==='pin'){const n=Number(v);s.pins=s.pins.includes(n)?s.pins.filter(x=>x!==n):[...s.pins,n];}draw(skin);persist(skin);});
root.addEventListener('change',ev=>{if(!ev.target.matches('select[data-action=hold]'))return;const skin=ev.target.closest('[data-skin]').dataset.skin;state[skin].hold=ev.target.value;draw(skin);persist(skin);});
window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(!v)return;for(const skin of Object.keys(state)){if(v[skin]&&markets[v[skin].hold]&&routes[v[skin].route]&&goods[v[skin].good]&&['markets','routes','rumors'].includes(v[skin].tab)&&Array.isArray(v[skin].pins)){state[skin]={...state[skin],...v[skin]};draw(skin);}}});
if(globalThis.Tweak){for(const el of root.querySelectorAll('[data-skin]')){const tune={text:15,contrast:false};const t=new Tweak({container:el,onChange:()=>{el.style.setProperty('--ui',tune.text+'px');el.style.setProperty('--soft',tune.contrast?'var(--ink)':'');}});t.addSlider(tune,'text',{label:'Text size',min:14,max:18,unit:'px'});t.addToggle(tune,'contrast',{label:'Stronger secondary text'});}}
})();
</script>
